# see https://idefix.readthedocs.io/latest/reference/idefix.ini.html

[Grid]
# format is Xn-grid | # of grid blocks | start | # of points | spacing type | end // start of next
# x1=r, x2=theta, and x3 = phi
# x1 is radial, theta is polar angle (angle to pole) i.e. goes from 0 to pi, azimuthal angle is around the azimuth and goes from 0 to 2pi
X1-grid    1  2.0  64   l  10.0
X2-grid    1  0    128  u  3.141592653589793 # pi
X3-grid    1  0.0  8    u  6.283185307179586 # 2 pi

[TimeIntegrator]
CFL         0.4
tstop       1e2
first_dt    1.e-6
nstages     2

[Hydro]
solver    hll

[Gravity]
potential   central  # mass defaults to 1 unit
Mcentral    1

[Units]
length      1e8
velocity    1e5
density     1.0

[Boundary]
X1-beg    outflow # define central boundary somehow
X1-end    outflow # outer edge of spherical accretion
X2-beg    axis # I don't know why we reflect at the poles (theta=0 and pi)
X2-end    axis
X3-beg    periodic # identify phi=0 with phi=2pi
X3-end    periodic

[Setup]
T0       2000.0
mu       30
Lstar    0.22
Tstar    4677
Mstar    0.76
a_p      0.0134
# a_p      100.0
M_p      0.01

[Output]
dmp_dir    ./out
vtk        -1.0 # disable vtk outputs
dmp        1.0 # time interval between outputs, in code units
log        1e3 # time interval between log outputs, in code steps (aka units ?)
